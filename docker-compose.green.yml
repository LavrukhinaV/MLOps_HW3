version: "3.9"

services:
  ml_service_v1:
    build: .
    container_name: ml_service_v1
    environment:
      MODEL_VERSION: "v1.0.0"
    expose:
      - "8080"

  ml_service_v2:
    build: .
    container_name: ml_service_v2
    environment:
      MODEL_VERSION: "v1.1.0"
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_canary
    depends_on:
      - ml_service_v1
      - ml_service_v2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
